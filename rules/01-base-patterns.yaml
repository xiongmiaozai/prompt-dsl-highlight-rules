# 基础结构正则规则（核心，无词典依赖）
# 新增格式仅追加节点，无需修改插件代码
# 包含：提示词语法 + Markdown 语法符号 + 操作标记
patterns:
  block_wrapper:
    regex: '【([^】]+)】'
    cssClass: "dsl-block-wrapper"
    captureGroup: 0
    priority: 30
  shot_header:
    regex: '(?:镜头|Shot|shot|SHOT)\s*(\d+)\s*(?:[（(]\s*(\d+(?:-\d+)?\.?\d*\s*(?:秒|s|S|Sec|sec))?(?:\s*[｜|]\s*[^）)]*)?\s*[）)])?'
    cssClass: "dsl-shot-header"
    captureGroup: 0
    priority: 35
