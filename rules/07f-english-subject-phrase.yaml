# ============================================================
# 分词器配置（可选，未配置时使用默认值）
# ============================================================
segmenterConfig:
  # 最大词长（字符数），超过此长度的词不会被匹配
  # 建议值 4-8，过大增加扫描成本，过小漏匹配长词
  maxWordLength: 6
  # 最小词长（字符数），小于此长度的连续段不进入分词
  # 设为 2 表示单字直接交由 06 字级规则处理
  minWordLength: 2

