# ============================================================
# 07-word-lexicon.yaml
# 词组语义分词词典（v2.6.0 新增，v2.6.1 扩展）
# ------------------------------------------------------------
# 本文件是字级组合规则（06）的前置层，采用最大正向匹配算法
# 对未着色的中文段进行分词，命中词组即着色。
#
# 设计原则：
#   1. 最小冗余：只收录 03-lexicon-optional.yaml 未覆盖的词组
#   2. 语义分组：每组绑定一个 cssClass 与优先级
#   3. YAML 驱动：新增词组无需改代码，热重载即生效
#   4. 词长建议 2-6 字，超过 8 字的整词应放入 03 词典
#
# 触发时机：
#   - patterns 与 lexicons 主匹配失败的未着色段
#   - 命中本词典的词组直接着色，未命中的连续单字交由 06 字级规则兜底
#
# 优先级体系（与 05-priority.yaml 对齐）：
#   constraint(48) > tech_param(47) > param_key(46)
#   > chapter_title(45) > camera_action(44) > emotion(43)
#   > scene_description(42) = character_action(42)
#   > atmosphere(41) = time_season(41)
#   > costume_makeup(40)
# ============================================================

# ============================================================
# 词组词典（按语义分组）
# ============================================================
